<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>WebSocket 채팅</title>
  </head>
  <body>
    <h1>WebSocket 채팅</h1>
    <p id="status">연결하는 중...</p>
    <form id="form">
      <input id="text" placeholder="메시지" autocomplete="off" />
      <button>보내기</button>
    </form>
    <ul id="list"></ul>
    <p id="typing"></p>

    <script>
      const name = new URLSearchParams(location.search).get('name');
      const status = document.querySelector('#status');
      const list = document.querySelector('#list');
      const typing = document.querySelector('#typing');
      const input = document.querySelector('#text');
      let typingTimer;
      const socket = new WebSocket(`ws://${location.host}`);

      socket.addEventListener('open', () => {
        status.textContent = '연결됐어요';
      });

      socket.addEventListener('close', () => {
        status.textContent = '연결이 끊겼어요';
      });

      // 서버가 보낸 것은 요청하지 않아도 이 이벤트로 들어온다.
      socket.addEventListener('message', (event) => {
        const message = JSON.parse(event.data);

        if (message.type === 'chat') {
          const li = document.createElement('li');
          li.textContent = `${message.name}: ${message.text}`;
          list.append(li);
          typing.textContent = '';
        }

        if (message.type === 'typing') {
          typing.textContent = `${message.name}님이 입력 중이에요...`;
          clearTimeout(typingTimer);
          typingTimer = setTimeout(() => {
            typing.textContent = '';
          }, 3000);
        }
      });

      input.addEventListener('input', () => {
        socket.send(JSON.stringify({ type: 'typing', name }));
      });

      document.querySelector('#form').addEventListener('submit', (event) => {
        event.preventDefault();
        socket.send(JSON.stringify({ type: 'chat', name, text: input.value }));
        input.value = '';
      });
    </script>
  </body>
</html>
