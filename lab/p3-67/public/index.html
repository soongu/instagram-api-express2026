<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>문의방 손님 화면</title>
  </head>
  <body>
    <h1>문의방 손님 화면</h1>
    <form id="who">
      <select id="user">
        <option value="seoyeon">seoyeon (1번 방 · 캠핑 의자)</option>
        <option value="sujin">sujin (2번 방 · 자전거 헬멧)</option>
        <option value="taeyang">taeyang (4번 방 · 무선 키보드)</option>
      </select>
      <button>연결</button>
    </form>
    <p id="status">연결하지 않았어요</p>
    <form id="send">
      <input id="text" placeholder="메시지" autocomplete="off" />
      <button>보내기</button>
    </form>
    <button id="drop" type="button">jaehoon 연결 10초 끊기</button>
    <p id="dropped"></p>
    <ul id="list"></ul>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./customer.js"></script>
  </body>
</html>
